name: Modernization CI

on:
  push:
    branches:
      - chore/react-router-v8-modernize
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: http://127.0.0.1:3000
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify single scroll engine
        shell: bash
        run: |
          if grep -RInE 'locomotive-scroll|react-locomotive-scroll|scrollerProxy|data-scroll' app package.json tsconfig.json; then
            echo 'Legacy or competing scroll controller detected.'
            exit 1
          fi

      - name: Verify retired dependencies stay removed
        shell: bash
        run: |
          if grep -RInE '@supabase/supabase-js|framer-motion|tiny-invariant|@react-router/serve|@netlify/vite-plugin-react-router|@fontsource/noto-sans-tc' app package.json vite.config.ts; then
            echo 'A retired database/auth/server/animation/font dependency was reintroduced.'
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify static production contract
        shell: bash
        run: |
          test -f build/client/index.html
          test -f build/client/__spa-fallback.html
          test -f build/client/_redirects
          test -f build/client/generated/tv-bg.webp
          test -f build/client/archive/index.html
          test -f build/client/lists/index.html
          test -f build/client/archive/sample-book/index.html
          test -f build/client/lists/sample-top-three/index.html
          test -f build/client/archive/type/book/index.html
          test -f build/client/archive/type/audio/index.html
          test -f build/client/archive/type/video/index.html
          test -f build/client/archive/tag/demo/index.html
          test -f build/client/archive/year/2026/index.html
          test -f build/client/archive/creator/sample-author/index.html
          test -f build/client/archive/creator/sample-audio-creator/index.html
          grep -q 'data-portfolio-template="ready"' build/client/index.html
          grep -q 'data-archive-template="ready"' build/client/archive/index.html
          grep -q 'data-archive-template="ready"' build/client/archive/creator/sample-author/index.html
          grep -q 'publish = "build/client"' netlify.toml

          if grep -RInE 'build/server|\[functions\]|\[edge_functions\]' netlify.toml; then
            echo 'Netlify configuration references a runtime server/functions path.'
            exit 1
          fi

          tv_bytes=$(stat -c%s build/client/generated/tv-bg.webp)
          echo "Optimized TV artwork: ${tv_bytes} bytes"
          if [ "$tv_bytes" -gt 3000000 ]; then
            echo 'Optimized TV artwork exceeded the 3 MB performance budget.'
            exit 1
          fi

      - name: Smoke test static production site
        shell: bash
        run: |
          npm run start > /tmp/portfolio-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/homepage.html; then
              test -s /tmp/homepage.html
              grep -q 'data-portfolio-template="ready"' /tmp/homepage.html
              curl --fail --silent --show-error http://127.0.0.1:3000/archive/ > /tmp/archive.html
              curl --fail --silent --show-error http://127.0.0.1:3000/lists/ > /tmp/lists.html
              curl --fail --silent --show-error http://127.0.0.1:3000/archive/creator/sample-author/ > /tmp/archive-creator.html
              grep -q 'data-archive-template="ready"' /tmp/archive.html
              grep -q 'data-archive-template="ready"' /tmp/lists.html
              grep -q 'data-archive-template="ready"' /tmp/archive-creator.html
              exit 0
            fi
            sleep 1
          done

          cat /tmp/portfolio-static.log
          exit 1

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Verify mobile scroll choreography in WebKit
        run: npm run test:scroll

      - name: Smoke test Netlify Deploy Preview
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--sydneyzhao.netlify.app/
        run: |
          for attempt in {1..60}; do
            status=$(curl -L --silent --show-error --output /tmp/netlify-preview.html --write-out '%{http_code}' "$PREVIEW_URL" || true)
            archive_status=$(curl -L --silent --show-error --output /tmp/netlify-archive.html --write-out '%{http_code}' "${PREVIEW_URL}archive/" || true)
            creator_status=$(curl -L --silent --show-error --output /tmp/netlify-creator.html --write-out '%{http_code}' "${PREVIEW_URL}archive/creator/sample-author/" || true)

            if [ "$status" = "200" ] && [ "$archive_status" = "200" ] && [ "$creator_status" = "200" ] && \
               grep -q 'data-portfolio-template="ready"' /tmp/netlify-preview.html && \
               grep -q 'data-archive-template="ready"' /tmp/netlify-archive.html && \
               grep -q 'data-archive-template="ready"' /tmp/netlify-creator.html; then
              echo "Netlify Deploy Preview is serving the static portfolio and creator archive successfully."
              exit 0
            fi

            echo "Waiting for healthy Netlify Deploy Preview (attempt $attempt/60, home $status, archive $archive_status, creator $creator_status)..."
            sleep 2
          done

          echo 'Netlify Deploy Preview never became healthy.'
          cat /tmp/netlify-preview.html || true
          cat /tmp/netlify-archive.html || true
          cat /tmp/netlify-creator.html || true
          exit 1

name: Modernization CI

on:
  push:
    branches:
      - chore/react-router-v8-modernize
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: http://127.0.0.1:3000
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify single scroll engine
        shell: bash
        run: |
          if grep -RInE 'locomotive-scroll|react-locomotive-scroll|scrollerProxy|data-scroll' app package.json tsconfig.json; then
            echo 'Legacy or competing scroll controller detected.'
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify browser-only libraries stay out of SSR
        shell: bash
        run: |
          if grep -RInF '"gsap"' build/server || \
             grep -RInF "'gsap'" build/server || \
             grep -RInF 'gsap/Scroll' build/server || \
             grep -RInF 'gsap/dist/' build/server; then
            echo 'GSAP leaked into the server bundle.'
            exit 1
          fi

          if grep -RInF '@react-three/' build/server || \
             grep -RInF '"three"' build/server || \
             grep -RInF "'three'" build/server; then
            echo 'Three.js or React Three Fiber leaked into the server bundle.'
            exit 1
          fi

      - name: Smoke test production server
        shell: bash
        run: |
          npm run start > /tmp/remix-portfolio.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/homepage.html; then
              test -s /tmp/homepage.html
              grep -q 'Seeing You Through The River' /tmp/homepage.html
              exit 0
            fi
            sleep 1
          done

          cat /tmp/remix-portfolio.log
          exit 1

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Verify mobile scroll choreography in WebKit
        run: npm run test:scroll

      - name: Smoke test Netlify Deploy Preview
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--sydneyzhao.netlify.app/
        run: |
          for attempt in {1..60}; do
            status=$(curl -L --silent --show-error \
              --output /tmp/netlify-preview.html \
              --write-out '%{http_code}' \
              "$PREVIEW_URL" || true)

            if [ "$status" = "200" ] && \
               grep -q 'Seeing You Through The River' /tmp/netlify-preview.html; then
              echo "Netlify Deploy Preview is serving the portfolio successfully."
              exit 0
            fi

            echo "Waiting for healthy Netlify Deploy Preview (attempt $attempt/60, HTTP $status)..."
            sleep 2
          done

          echo 'Netlify Deploy Preview never became healthy.'
          cat /tmp/netlify-preview.html || true
          exit 1

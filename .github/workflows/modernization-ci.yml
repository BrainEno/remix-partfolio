name: Modernization CI

on:
  push:
    branches:
      - chore/react-router-v8-modernize
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: http://127.0.0.1:3000
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify single scroll engine
        shell: bash
        run: |
          if grep -RInE 'locomotive-scroll|react-locomotive-scroll|scrollerProxy|data-scroll' app package.json tsconfig.json; then
            echo 'Legacy or competing scroll controller detected.'
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify GSAP is client-only
        shell: bash
        run: |
          if grep -RInF 'from "gsap"' build/server || \
             grep -RInF "from 'gsap'" build/server || \
             grep -RInF 'gsap/dist/Scroll' build/server; then
            echo 'GSAP leaked into the server bundle.'
            exit 1
          fi

      - name: Smoke test production server
        shell: bash
        run: |
          npm run start > /tmp/remix-portfolio.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/homepage.html; then
              test -s /tmp/homepage.html
              grep -q 'Seeing You Through The River' /tmp/homepage.html
              exit 0
            fi
            sleep 1
          done

          cat /tmp/remix-portfolio.log
          exit 1
